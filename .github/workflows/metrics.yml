name: Update Profile Metrics

on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'profile.config.json'
      - '.github/workflows/metrics.yml'

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate tech arsenal & metrics SVG cards
        env:
          # Optional classic PAT (scopes: repo, read:org). Adds private repos and
          # private contributions. Without it only public data is used.
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate-metrics.mjs

      - name: Commit & push updated SVGs
        run: |
          if git diff --quiet assets/; then
            echo "No changes in assets/*.svg"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tech-arsenal.svg assets/metrics.svg
          git commit -m "chore(metrics): update tech arsenal & profile stats [skip ci]"
          git pull --rebase origin main
          git push
